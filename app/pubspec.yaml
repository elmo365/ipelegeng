name: ipelege
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  # Grapheme-safe first characters, for the sign-in initials. A name is not
  # guaranteed to be one code unit per letter and `substring(0, 1)` would cut
  # some of them in half.
  characters: ^1.4.1
  decimal: ^3.2.6
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  # Test-only. identity_test hashes the launcher icons so a replaced icon
  # cannot slip past docs/identity.md.
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # The brand mark, cut from the design's adaptive-icon foreground — the
    # highest-resolution complete cut that fits through the 256 KiB fetch cap.
    # See docs/identity.md.
    - assets/brand/

  # Bundled, not fetched at runtime: the app has to start on a bad connection.
  # OFL licence in assets/fonts/LICENSE.txt.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # Money, timestamps and OTP only.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
